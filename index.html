<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a43"><title>HRM Lokal — Manajemen SDM</title>
<style>
:root{--navy:#102a43;--navy2:#183b56;--teal:#0e9384;--teal-light:#e4f5f2;--bg:#f4f7fa;--line:#e4eaf0;--text:#172b4d;--muted:#697b91;--white:#fff;--red:#c9372c;--amber:#a15c00;--shadow:0 10px 28px #102a4310}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--navy);color:#eaf1f7;padding:22px 14px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px}.brand-mark{background:var(--teal);color:white;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:800}.brand strong{display:block;font-size:16px}.brand small{color:#aac0d2}.nav-label{font-size:10px;letter-spacing:1.2px;color:#91a9bc;padding:0 12px 8px;font-weight:700}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c5d3df;text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:12px;font-weight:600}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav .icon{width:20px;text-align:center;font-size:16px}.side-foot{margin-top:auto;border-top:1px solid #ffffff20;padding:14px 10px;color:#a8bdce;font-size:12px}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:13px}.top-right{display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--teal-light);color:var(--teal);font-weight:800}.content{max-width:1400px;padding:28px 32px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.page-head h1{font-size:25px;margin:0 0 5px;letter-spacing:-.4px}.page-head p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:9px 13px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:#f8fafc}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{color:var(--red)}.btn.small{font-size:12px;padding:6px 9px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat,.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.stat{padding:18px 19px;display:flex;justify-content:space-between;align-items:center}.stat-label{color:var(--muted);font-size:12px;font-weight:600}.stat-value{font-size:25px;font-weight:750;margin-top:3px}.stat-icon{width:42px;height:42px;border-radius:12px;background:var(--teal-light);color:var(--teal);display:grid;place-items:center;font-size:18px}.panel{padding:18px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel-head h2{font-size:15px;margin:0}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{min-width:220px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0e93841a;outline:none}.select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;color:var(--text)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:#f8fafc;padding:11px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #edf1f5}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcfd}.person{display:flex;align-items:center;gap:10px}.person-avatar{width:34px;height:34px;border-radius:10px;background:#e8eff7;display:grid;place-items:center;font-weight:750;color:#315b7d}.person strong{display:block}.person small,.subtle{color:var(--muted);font-size:12px}.badge{display:inline-flex;padding:4px 8px;border-radius:20px;background:#edf2f7;color:#52677b;font-size:11px;font-weight:700}.badge.green{background:#e5f6ec;color:#247345}.badge.blue{background:#e9f2ff;color:#315ea8}.badge.orange{background:#fff3dc;color:#936000}.badge.red{background:#fff0ee;color:#ad3028}.empty{text-align:center;padding:35px;color:var(--muted)}.grid-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{background:#f0f7ff;border:1px solid #d5e7fa;color:#355777;border-radius:9px;padding:12px 14px;font-size:12px;margin-bottom:16px}.competency{min-width:700px}.competency th:first-child,.competency td:first-child{position:sticky;left:0;background:white;z-index:1}.competency th:first-child{background:#f8fafc}.level{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:7px;background:var(--teal-light);color:#08776b;font-weight:750}.muted-level{background:#f0f2f5;color:#98a3ae}.meter{height:7px;width:90px;background:#edf1f5;border-radius:9px;overflow:hidden}.meter span{display:block;height:100%;background:var(--teal);border-radius:9px}.modal-backdrop{position:fixed;inset:0;background:#0b1d2b88;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:white;border-radius:14px;box-shadow:0 20px 70px #0003}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:17px}.modal-body{padding:20px 22px}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#4b5e72}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:white;color:var(--text)}.field textarea{min-height:82px;resize:vertical}.close{border:0;background:transparent;font-size:22px;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:#173d35;color:white;border-radius:9px;padding:12px 16px;box-shadow:var(--shadow);z-index:20;display:none}.toast.show{display:block;animation:fade 2.8s forwards}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}.mobile-menu{display:none}.footer-note{font-size:11px;color:var(--muted);text-align:center;padding:8px}.danger-zone{border:1px solid #f1d4d1;background:#fff9f8;border-radius:10px;padding:16px}.file-input{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;z-index:8;inset:0 auto 0 0;width:250px;transform:translateX(-105%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.topbar{padding:0 18px}.content{padding:22px 18px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.page-head{display:block}.page-head .actions{margin-top:14px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px}.stat-value{font-size:21px}.stat-icon{width:35px;height:35px}.grid-two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.content{padding:17px 12px}.topbar{height:60px}.search{min-width:155px}.page-head h1{font-size:22px}}
</style></head>
<body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">H</div><div><strong>HRM Lokal</strong><small>People management</small></div></div><div><div class="nav-label">MENU UTAMA</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="icon">▦</span>Dashboard</button><button data-page="employees"><span class="icon">♙</span>Karyawan</button><button data-page="contracts"><span class="icon">▤</span>PKWT / PKWTT</button><button data-page="training"><span class="icon">◇</span>Training</button><button data-page="competencies"><span class="icon">▦</span>Matriks Kompetensi</button></nav></div><div class="side-foot">Data tersimpan hanya di browser ini.<br><b>Backup data secara berkala.</b></div></aside><main class="main"><header class="topbar"><div class="top-right"><button class="btn mobile-menu" id="menuToggle" aria-label="Buka menu">☰</button><span class="crumb">HRM Lokal <span style="color:#b6c1cb">/</span> <b id="crumb">Dashboard</b></span></div><div class="top-right"><span class="subtle">Mode lokal</span><div class="avatar">HR</div></div></header><div class="content" id="content"></div></main></div><div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="modalClose">×</button></div><form id="modalForm"><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn" id="cancelModal">Batal</button><button class="btn primary" type="submit">Simpan</button></div></form></div></div><div class="toast" id="toast"></div><input class="file-input" type="file" id="importFile" accept="application/json,.json">
<script>
(()=>{'use strict';const KEY='hrm-lokal-v1';const empty={employees:[],contracts:[],trainings:[],competencies:[]};let db=load();let page='dashboard';let editing=null;function load(){try{return {...empty,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(empty)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify('Penyimpanan penuh. Hapus data atau ekspor backup.');return false}}const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';const today=()=>new Date().toISOString().slice(0,10);const names={dashboard:'Dashboard',employees:'Karyawan',contracts:'PKWT / PKWTT',training:'Training',competencies:'Matriks Kompetensi'};function notify(t){const el=$('#toast');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}function initials(n){return (n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function option(list,val,label){return `<option value="${esc(val)}">${esc(label)}</option>`}function stat(label,value,icon){return `<div class="stat"><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div><div class="stat-icon">${icon}</div></div>`}function head(title,desc,buttons=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}function btn(text,action,primary=false){return `<button class="btn ${primary?'primary':''}" data-action="${action}">${text}</button>`}function employeeName(id){return db.employees.find(e=>e.id===id)?.name||'Karyawan tidak ditemukan'}function render(){const c=$('#content');$('#crumb').textContent=names[page];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='dashboard')c.innerHTML=dashboard();if(page==='employees')c.innerHTML=employees();if(page==='contracts')c.innerHTML=contracts();if(page==='training')c.innerHTML=trainings();if(page==='competencies')c.innerHTML=competencies();}
function dashboard(){let active=db.employees.filter(e=>e.status!=='Nonaktif').length;let expiring=db.contracts.filter(x=>x.type==='PKWT'&&x.endDate&&x.endDate>=today()&&((new Date(x.endDate)-new Date())/86400000)<=60).length;let done=db.trainings.filter(t=>t.status==='Selesai').length;let skills=new Set(db.competencies.map(x=>x.skill).filter(Boolean)).size;let recent=[...db.employees].slice(-5).reverse();return `${head('Dashboard','Ringkasan data dan aktivitas SDM Anda.',`${btn('⇩ Backup data','export')} ${btn('⇧ Pulihkan data','import')}`)}<section class="stats">${stat('Karyawan aktif',active,'♙')}${stat('Kontrak berakhir ≤60 hari',expiring,'◷')}${stat('Training selesai',done,'◇')}${stat('Kompetensi terdaftar',skills,'▦')}</section><div class="grid-two"><section class="panel"><div class="panel-head"><h2>Karyawan terbaru</h2><button class="btn small" data-page="employees">Lihat semua →</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Departemen</th><th>Status</th></tr></thead><tbody>${recent.map(e=>`<tr><td><div class="person"><div class="person-avatar">${esc(initials(e.name))}</div><div><strong>${esc(e.name)}</strong><small>${esc(e.employeeId||'')}</small></div></div></td><td>${esc(e.department||'—')}</td><td>${badge(e.status||'Aktif')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Belum ada data karyawan.<br>Mulai dengan menambahkan karyawan.</div>`}</section><section class="panel"><div class="panel-head"><h2>Pengingat kontrak</h2><button class="btn small" data-page="contracts">Kelola →</button></div>${expiring?db.contracts.filter(x=>x.type==='PKWT'&&x.endDate&&x.endDate>=today()&&((new Date(x.endDate)-new Date())/86400000)<=60).map(x=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><b>${esc(employeeName(x.employeeId))}</b><div class="subtle">Berakhir ${fmt(x.endDate)} · ${esc(x.contractNo||'Tanpa nomor')}</div></div>`).join(''):'<div class="empty">Tidak ada kontrak yang akan berakhir dalam 60 hari.</div>'}</section></div><div class="notice">💾 Data tersimpan otomatis di browser/perangkat ini menggunakan localStorage. Gunakan Backup data untuk menyimpan salinan JSON.</div>`}function badge(v){let cls=v==='Aktif'||v==='Selesai'?'green':v==='PKWTT'?'blue':v==='Berjalan'?'orange':v==='Nonaktif'?'red':'';return `<span class="badge ${cls}">${esc(v||'—')}</span>`}function employees(){return `${head('Manajemen Karyawan','Kelola profil, pekerjaan, dan informasi karyawan.',`${btn('+ Tambah karyawan','add-employee',true)} ${btn('⇩ Ekspor CSV','csv-employees')}`)}<section class="stats">${stat('Total karyawan',db.employees.length,'♙')}${stat('Aktif',db.employees.filter(e=>e.status!=='Nonaktif').length,'✓')}${stat('Departemen',new Set(db.employees.map(e=>e.department).filter(Boolean)).size,'▤')}${stat('Lokasi kerja',new Set(db.employees.map(e=>e.location).filter(Boolean)).size,'⌖')}</section><section class="panel"><div class="panel-head"><h2>Daftar karyawan</h2><div class="toolbar"><input class="search" id="employeeSearch" placeholder="Cari nama, ID, email…"><select class="select" id="employeeStatus"><option value="">Semua status</option><option>Aktif</option><option>Nonaktif</option></select></div></div><div id="employeeTable">${employeeTable(db.employees)}</div></section>`}function employeeTable(rows){if(!rows.length)return '<div class="empty">Belum ada karyawan yang cocok.</div>';return `<div class="table-wrap"><table><thead><tr><th>Karyawan</th><th>Jabatan / departemen</th><th>Kontak</th><th>Tanggal bergabung</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(e=>`<tr><td><div class="person"><div class="person-avatar">${esc(initials(e.name))}</div><div><strong>${esc(e.name)}</strong><small>${esc(e.employeeId||'Tanpa ID')} · ${esc(e.gender||'')}</small></div></div></td><td>${esc(e.position||'—')}<div class="subtle">${esc(e.department||'—')}</div></td><td>${esc(e.email||'—')}<div class="subtle">${esc(e.phone||'')}</div></td><td>${fmt(e.joinDate)}</td><td>${badge(e.status||'Aktif')}</td><td><button class="btn small" data-action="edit-employee" data-id="${esc(e.id)}">Edit</button> <button class="btn small danger" data-action="delete-employee" data-id="${esc(e.id)}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
function contracts(){return `${head('Dokumen PKWT / PKWTT','Catat data pokok perjanjian kerja dan tanggal berlakunya.',btn('+ Tambah kontrak','add-contract',true))}<div class="notice">Modul ini mencatat metadata dan membantu pengingat masa berlaku. Unggah/penyimpanan berkas kontrak belum disediakan; simpan dokumen asli secara aman dan batasi akses. Gunakan format dokumen yang telah ditinjau sesuai ketentuan hukum yang berlaku.</div><section class="panel"><div class="panel-head"><h2>Daftar kontrak kerja</h2><div class="toolbar"><input class="search" id="contractSearch" placeholder="Cari karyawan / nomor…"><select class="select" id="contractType"><option value="">Semua jenis</option><option>PKWT</option><option>PKWTT</option></select></div></div><div id="contractTable">${contractTable(db.contracts)}</div></section>`}function contractTable(rows){if(!rows.length)return '<div class="empty">Belum ada catatan kontrak.</div>';return `<div class="table-wrap"><table><thead><tr><th>Karyawan</th><th>Jenis</th><th>Nomor dokumen</th><th>Mulai</th><th>Berakhir</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(employeeName(x.employeeId))}</strong></td><td>${badge(x.type)}</td><td>${esc(x.contractNo||'—')}</td><td>${fmt(x.startDate)}</td><td>${x.type==='PKWT'?fmt(x.endDate):'Tidak ditentukan'}</td><td>${badge(x.status||'Aktif')}</td><td><button class="btn small" data-action="edit-contract" data-id="${esc(x.id)}">Edit</button> <button class="btn small danger" data-action="delete-contract" data-id="${esc(x.id)}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
function trainings(){return `${head('Training Karyawan','Rencanakan pelatihan dan catat status serta hasilnya.',btn('+ Tambah training','add-training',true))}<section class="stats">${stat('Total program',db.trainings.length,'◇')}${stat('Direncanakan',db.trainings.filter(x=>x.status==='Direncanakan').length,'◷')}${stat('Berjalan',db.trainings.filter(x=>x.status==='Berjalan').length,'↗')}${stat('Selesai',db.trainings.filter(x=>x.status==='Selesai').length,'✓')}</section><section class="panel"><div class="panel-head"><h2>Program training</h2><div class="toolbar"><input class="search" id="trainingSearch" placeholder="Cari program / peserta…"><select class="select" id="trainingStatus"><option value="">Semua status</option><option>Direncanakan</option><option>Berjalan</option><option>Selesai</option><option>Dibatalkan</option></select></div></div><div id="trainingTable">${trainingTable(db.trainings)}</div></section>`}function trainingTable(rows){if(!rows.length)return '<div class="empty">Belum ada program training.</div>';return `<div class="table-wrap"><table><thead><tr><th>Program</th><th>Peserta</th><th>Penyelenggara</th><th>Tanggal</th><th>Jam</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.title)}</strong><div class="subtle">${esc(x.category||'')}</div></td><td>${esc(employeeName(x.employeeId))}</td><td>${esc(x.provider||'—')}</td><td>${fmt(x.date)}</td><td>${esc(x.hours||'—')}</td><td>${badge(x.status||'Direncanakan')}</td><td><button class="btn small" data-action="edit-training" data-id="${esc(x.id)}">Edit</button> <button class="btn small danger" data-action="delete-training" data-id="${esc(x.id)}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
function competencies(){let skills=[...new Set(db.competencies.map(x=>x.skill).filter(Boolean))].sort();let emps=db.employees.filter(e=>e.status!=='Nonaktif');return `${head('Matriks Kompetensi','Nilai kompetensi karyawan pada skala 1–5.',btn('+ Catat kompetensi','add-competency',true))}<div class="notice">Skala: 1 = pemula · 2 = dasar · 3 = kompeten · 4 = mahir · 5 = ahli. Penilaian ini merupakan catatan internal; sepakati kriteria yang konsisten dengan organisasi Anda.</div><section class="panel"><div class="panel-head"><h2>Matriks kompetensi</h2><span class="subtle">${skills.length} kompetensi · ${emps.length} karyawan aktif</span></div>${!skills.length||!emps.length?'<div class="empty">Tambahkan karyawan dan catatan kompetensi untuk melihat matriks.</div>':`<div class="table-wrap"><table class="competency"><thead><tr><th>Karyawan</th>${skills.map(s=>`<th>${esc(s)}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>${emps.map(e=>`<tr><td><strong>${esc(e.name)}</strong><div class="subtle">${esc(e.position||'')}</div></td>${skills.map(s=>{let it=db.competencies.find(x=>x.employeeId===e.id&&x.skill===s);return `<td>${it?`<span class="level" title="${esc(it.note||'')}">${esc(it.level)}</span>`:'<span class="level muted-level">—</span>'}</td>`}).join('')}<td><button class="btn small" data-action="add-competency-for" data-id="${esc(e.id)}">+ Nilai</button></td></tr>`).join('')}</tbody></table></div>`}</section><section class="panel"><div class="panel-head"><h2>Catatan penilaian</h2></div>${db.competencies.length?`<div class="table-wrap"><table><thead><tr><th>Karyawan</th><th>Kompetensi</th><th>Nilai</th><th>Tanggal</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody>${db.competencies.map(x=>`<tr><td>${esc(employeeName(x.employeeId))}</td><td>${esc(x.skill)}</td><td><span class="level">${esc(x.level)}</span></td><td>${fmt(x.date)}</td><td>${esc(x.note||'—')}</td><td><button class="btn small danger" data-action="delete-competency" data-id="${esc(x.id)}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada catatan penilaian.</div>'}</section>`}
function selectEmployees(selected=''){return `<select name="employeeId" required>${option('','Pilih karyawan')}</select>`}function fillEmployeeOptions(){document.querySelectorAll('select[name="employeeId"]').forEach(s=>{const val=s.dataset.selected||'';s.innerHTML=option('','Pilih karyawan')+db.employees.map(e=>option(e.id,e.name+' · '+(e.employeeId||e.department||''))).join('');s.value=val})}
function openModal(title,fields,record=null){editing=record;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=`<div class="form-grid">${fields.map(f=>{let value=record?.[f.name]??f.value??'';return `<div class="field ${f.full?'full':''}"><label>${esc(f.label)}${f.required?' *':''}</label>${f.type==='select'?`<select name="${f.name}" ${f.required?'required':''} ${f.options?'':'data-employee-select'}>${f.options||''}</select>`:f.type==='textarea'?`<textarea name="${f.name}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">${esc(value)}</textarea>`:`<input name="${f.name}" type="${f.type||'text'}" value="${esc(value)}" ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} placeholder="${esc(f.placeholder||'')}">`}</div>`}).join('')}</div>`;fields.forEach(f=>{if(f.type==='select'){let el=$(`[name="${f.name}"]`);if(f.employee){el.dataset.selected=record?.[f.name]||f.value||''}else el.value=record?.[f.name]??f.value??''}});if(fields.some(f=>f.employee))fillEmployeeOptions();$('#modalBackdrop').classList.add('open')}
const f=(name,label,opts={})=>({name,label,...opts});function showEmployee(rec){openModal(rec?'Edit data karyawan':'Tambah karyawan',[f('name','Nama lengkap',{required:true}),f('employeeId','ID karyawan',{placeholder:'Contoh: EMP-001'}),f('gender','Jenis kelamin',{type:'select',options:'<option value="">Pilih</option><option>Perempuan</option><option>Laki-laki</option><option>Tidak ingin menyebutkan</option>'}),f('birthDate','Tanggal lahir',{type:'date'}),f('email','Email',{type:'email'}),f('phone','Nomor telepon',{type:'tel'}),f('address','Alamat',{type:'textarea',full:true}),f('department','Departemen'),f('position','Jabatan'),f('location','Lokasi kerja'),f('joinDate','Tanggal bergabung',{type:'date'}),f('employmentType','Jenis hubungan kerja',{type:'select',options:'<option value="">Pilih</option><option>PKWT</option><option>PKWTT</option><option>Magang</option><option>Lainnya</option>'}),f('manager','Atasan langsung'),f('status','Status',{type:'select',options:'<option>Aktif</option><option>Nonaktif</option>'}),f('emergencyContact','Kontak darurat',{full:true}),f('notes','Catatan',{type:'textarea',full:true})],rec)}function showContract(rec){openModal(rec?'Edit kontrak':'Tambah kontrak',[f('employeeId','Karyawan',{type:'select',employee:true,required:true}),f('type','Jenis kontrak',{type:'select',required:true,options:'<option>PKWT</option><option>PKWTT</option>'}),f('contractNo','Nomor kontrak'),f('startDate','Tanggal mulai',{type:'date',required:true}),f('endDate','Tanggal berakhir (khusus PKWT)',{type:'date'}),f('status','Status',{type:'select',options:'<option>Aktif</option><option>Berakhir</option><option>Dibatalkan</option>'}),f('notes','Catatan',{type:'textarea',full:true})],rec)}function showTraining(rec,employeeId){openModal(rec?'Edit training':'Tambah training',[f('title','Nama program',{required:true}),f('employeeId','Peserta',{type:'select',employee:true,required:true,value:employeeId}),f('category','Kategori'),f('provider','Penyelenggara'),f('date','Tanggal',{type:'date'}),f('hours','Durasi (jam)',{type:'number',min:0}),f('status','Status',{type:'select',options:'<option>Direncanakan</option><option>Berjalan</option><option>Selesai</option><option>Dibatalkan</option>'}),f('result','Hasil / sertifikat'),f('notes','Catatan',{type:'textarea',full:true})],rec)}function showCompetency(rec,employeeId){openModal('Catat kompetensi',[f('employeeId','Karyawan',{type:'select',employee:true,required:true,value:employeeId}),f('skill','Nama kompetensi',{required:true,placeholder:'Contoh: Komunikasi'}),f('level','Nilai (1–5)',{type:'number',min:1,required:true}),f('date','Tanggal penilaian',{type:'date',value:today()}),f('note','Catatan',{type:'textarea',full:true})],rec)}
function closeModal(){$('#modalBackdrop').classList.remove('open');editing=null}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function deleteItem(type,itemId){if(!confirm('Hapus catatan ini? Tindakan ini tidak dapat dibatalkan.'))return;db[type]=db[type].filter(x=>x.id!==itemId);save();render();notify('Data berhasil dihapus.')}
function exportData(){const blob=new Blob([JSON.stringify({app:'HRM Lokal',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});download(blob,'hrm-lokal-backup-'+today()+'.json');notify('Backup JSON berhasil dibuat.')}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csvEmployees(){const rows=[['ID Karyawan','Nama','Jenis kelamin','Tanggal lahir','Email','Telepon','Alamat','Departemen','Jabatan','Lokasi','Tanggal bergabung','Jenis kerja','Atasan','Status','Kontak darurat','Catatan'],...db.employees.map(e=>['employeeId','name','gender','birthDate','email','phone','address','department','position','location','joinDate','employmentType','manager','status','emergencyContact','notes'].map(k=>e[k]||''))];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'karyawan-'+today()+'.csv')}function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);const data=parsed.data||parsed;if(!Array.isArray(data.employees)||!Array.isArray(data.contracts)||!Array.isArray(data.trainings)||!Array.isArray(data.competencies))throw Error();if(!confirm('Pulihkan backup akan mengganti semua data saat ini. Lanjutkan?'))return;db=data;save();render();notify('Data berhasil dipulihkan.')}catch(e){notify('File backup tidak valid. Data harus berupa JSON backup HRM Lokal.')}};reader.readAsText(file)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render();$('#sidebar').classList.remove('open')}});$('#content').addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,recId=b.dataset.id;if(a==='export')exportData();if(a==='import')$('#importFile').click();if(a==='add-employee')showEmployee();if(a==='edit-employee')showEmployee(db.employees.find(x=>x.id===recId));if(a==='delete-employee')deleteItem('employees',recId);if(a==='add-contract'){if(!db.employees.length)return notify('Tambahkan karyawan terlebih dahulu.');showContract()}if(a==='edit-contract')showContract(db.contracts.find(x=>x.id===recId));if(a==='delete-contract')deleteItem('contracts',recId);if(a==='add-training'){if(!db.employees.length)return notify('Tambahkan karyawan terlebih dahulu.');showTraining()}if(a==='edit-training')showTraining(db.trainings.find(x=>x.id===recId));if(a==='delete-training')deleteItem('trainings',recId);if(a==='add-competency'){if(!db.employees.length)return notify('Tambahkan karyawan terlebih dahulu.');showCompetency()}if(a==='add-competency-for')showCompetency(null,recId);if(a==='delete-competency')deleteItem('competencies',recId);if(a==='csv-employees')csvEmployees()});$('#modalClose').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});$('#modalForm').addEventListener('submit',e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());if(obj.level&&(+obj.level<1||+obj.level>5))return notify('Nilai kompetensi harus antara 1 dan 5.');if(obj.type==='PKWTT')obj.endDate='';let collection=page==='employees'?'employees':page==='contracts'?'contracts':page==='training'?'trainings':'competencies';if(editing){Object.assign(editing,obj)}else db[collection].push({id:id(),...obj});save();closeModal();render();notify('Data berhasil disimpan.')});$('#content').addEventListener('input',e=>{if(e.target.id==='employeeSearch')filterEmployees();if(e.target.id==='contractSearch')filterContracts();if(e.target.id==='trainingSearch')filterTrainings()});$('#content').addEventListener('change',e=>{if(e.target.id==='employeeStatus')filterEmployees();if(e.target.id==='contractType')filterContracts();if(e.target.id==='trainingStatus')filterTrainings()});function filterEmployees(){let q=($('#employeeSearch')?.value||'').toLowerCase(),s=$('#employeeStatus')?.value||'';let rows=db.employees.filter(x=>(!s||(x.status||'Aktif')===s)&&Object.values(x).some(v=>String(v).toLowerCase().includes(q)));$('#employeeTable').innerHTML=employeeTable(rows)}function filterContracts(){let q=($('#contractSearch')?.value||'').toLowerCase(),s=$('#contractType')?.value||'';$('#contractTable').innerHTML=contractTable(db.contracts.filter(x=>(!s||x.type===s)&&(employeeName(x.employeeId)+' '+(x.contractNo||'')).toLowerCase().includes(q)))}function filterTrainings(){let q=($('#trainingSearch')?.value||'').toLowerCase(),s=$('#trainingStatus')?.value||'';$('#trainingTable').innerHTML=trainingTable(db.trainings.filter(x=>(!s||x.status===s)&&(x.title+' '+employeeName(x.employeeId)).toLowerCase().includes(q)))}$('#importFile').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value=''});$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');window.addEventListener('storage',e=>{if(e.key===KEY){db=load();render()}});render()})();
